[general]
# Number of particles (default: 1000, min: 2, max: 32768)
particles = 1000

# Start in fullscreen mode (true/false)
fullscreen = false

# Target FPS (0 = auto from display refresh rate)
target_fps = 0

# Particle point size multiplier (default: 1.0, range: 0.1-10.0)
point_scale = 1.0

# Hypercolor mode: velocity shifts particle color (true/false)
hypercolor = true

# Hypercolor sensitivity (higher = faster color change, default: 8.0)
hyper_intensity = 8.0

# Hypercolor low-velocity color (RGB 0.0-1.0) — orange-ish
hyper_lo_r = 1.0
hyper_lo_g = 0.19
hyper_lo_b = 0.065

# Hypercolor high-velocity color (RGB 0.0-1.0) — blue-white
hyper_hi_r = 0.6
hyper_hi_g = 0.8
hyper_hi_b = 1.0

# Static particle color when hypercolor=false (RGB 0.0-1.0)
particle_color_r = 1.0
particle_color_g = 0.19
particle_color_b = 0.065
