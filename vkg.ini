[general]
# Number of particles (default: 1000)
particles = 1000

# Start in fullscreen mode (true/false)
fullscreen = false

# Target FPS (0 = auto from display refresh rate)
target_fps = 0

# Particle point size multiplier (default: 1.0, range: 0.1-10.0)
point_scale = 1.0

# Hypercolor mode: "off" (base color only), "color" (velocity shifts hue),
# "brightness" (velocity boosts brightness of base color)
hypercolor_mode = color

# Hypercolor sensitivity (higher = faster change, default: 8.0)
hyper_intensity = 8.0

# Hypercolor base color — used as the particle color (RGB 0.0-1.0)
# In "off" mode: static color. In "color" mode: low-velocity endpoint.
# In "brightness" mode: base color boosted by velocity.
hyper_lo_r = 1.0
hyper_lo_g = 0.19
hyper_lo_b = 0.065

# Hypercolor high-velocity color (RGB 0.0-1.0) — used in "color" mode only
hyper_hi_r = 0.6
hyper_hi_g = 0.8
hyper_hi_b = 1.0

# HDR display output (true/false — enables native HDR via scRGB or HDR10 PQ)
hdr = true

# Maximum display luminance for HDR (nits, default: 1000)
# Set to your monitor's actual peak brightness for best results
hdr_max_luminance = 1000
