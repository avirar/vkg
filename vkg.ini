[general]
# Number of particles (default: 1000)
particles = 1000000

# Start in fullscreen mode (true/false)
fullscreen = true

# Target FPS (0 = auto from display refresh rate)
target_fps = 0

# Particle point size multiplier (default: 1.0, range: 0.1-10.0)
point_scale = 1.0

# Auto-scale point size based on particle count (true/false)
# When true, points get smaller at higher counts to maintain performance
auto_point_scale = true

# Velocity hypercolor mode: "off" (static), "color" (speed→hue), "brightness" (speed→boost)
hypercolor_velocity_mode = color

# Distance hypercolor mode: "off" (static), "color" (proximity→hue), "brightness" (proximity→boost)
hypercolor_distance_mode = brightness

# Hypercolor velocity intensity (higher = faster hue shift from speed, 0=off)
hyper_velocity_intensity = 8.0

# Hypercolor distance intensity (higher = more glow near singularity, 0=off)
hyper_distance_intensity = 4.0

# Velocity palette: low-speed color (RGB 0.0-1.0)
hyper_vel_lo_r = 1.0
hyper_vel_lo_g = 0.19
hyper_vel_lo_b = 0.065

# Velocity palette: high-speed color (RGB 0.0-1.0)
hyper_vel_hi_r = 0.6
hyper_vel_hi_g = 0.8
hyper_vel_hi_b = 1.0

# Distance palette: far-away color (RGB 0.0-1.0)
hyper_dist_lo_r = 1.0
hyper_dist_lo_g = 0.19
hyper_dist_lo_b = 0.065

# Distance palette: near-singularity color (RGB 0.0-1.0)
hyper_dist_hi_r = 0.6
hyper_dist_hi_g = 0.8
hyper_dist_hi_b = 1.0

# HDR display output (true/false — enables native HDR via scRGB or HDR10 PQ)
hdr = true

# Maximum display luminance for HDR (nits, default: 1000)
# Set to your monitor's actual peak brightness for best results
hdr_max_luminance = 1000

# Number of gravitational singularities (1-8, default: 1)
singularity_count = 2
